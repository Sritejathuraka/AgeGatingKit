name: age_gating_kit
description: A cross-platform Flutter plugin for age assurance, age gating, parental consent, and regulatory age requirements on iOS and Android.
version: 1.0.0

homepage: https://github.com/Sritejathuraka/AgeGatingKit
repository: https://github.com/Sritejathuraka/AgeGatingKit
issue_tracker: https://github.com/Sritejathuraka/AgeGatingKit/issues

environment:
  sdk: ^3.13.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.sritejathuraka.age_gating_kit
        pluginClass: AgeGatingKitPlugin
      ios:
        pluginClass: AgeGatingKitPlugin